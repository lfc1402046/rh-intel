<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
  <!-- 背景 -->
  <rect width="1280" height="800" fill="#FBFBFD"/>
  <!-- Header -->
  <rect width="1280" height="56" fill="#FFFFFF"/>
  <rect x="0" y="56" width="1280" height="1" fill="#E5E5EA"/>
  <rect x="32" y="16" width="24" height="24" rx="6" fill="#8B7FE8"/>
  <text x="68" y="33" font-family="-apple-system" font-size="14" font-weight="600" fill="#1D1D1F">RH Intel</text>
  <text x="280" y="33" font-family="-apple-system" font-size="13" fill="#6E6E73">看板</text>
  <text x="340" y="33" font-family="-apple-system" font-size="13" fill="#6E6E73">图谱</text>
  <text x="400" y="33" font-family="-apple-system" font-size="13" fill="#6E6E73">时间线</text>
  <text x="480" y="33" font-family="-apple-system" font-size="13" fill="#6E6E73">标签</text>

  <!-- 4 个数据指标卡 -->
  <g transform="translate(40, 90)">
    <rect width="280" height="120" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="20" y="35" font-family="-apple-system" font-size="12" fill="#86868B">📞 待联系</text>
    <text x="20" y="84" font-family="-apple-system" font-size="36" font-weight="700" fill="#E8919C">7</text>
    <text x="120" y="84" font-family="-apple-system" font-size="12" fill="#86868B">较上周 +2</text>
  </g>
  <g transform="translate(340, 90)">
    <rect width="280" height="120" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="20" y="35" font-family="-apple-system" font-size="12" fill="#86868B">⭐ 重要人脉</text>
    <text x="20" y="84" font-family="-apple-system" font-size="36" font-weight="700" fill="#FFD66B">23</text>
    <text x="120" y="84" font-family="-apple-system" font-size="12" fill="#86868B">5★ 5 · 4★ 18</text>
  </g>
  <g transform="translate(640, 90)">
    <rect width="280" height="120" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="20" y="35" font-family="-apple-system" font-size="12" fill="#86868B">📅 近期事件</text>
    <text x="20" y="84" font-family="-apple-system" font-size="36" font-weight="700" fill="#FFB088">3</text>
    <text x="120" y="84" font-family="-apple-system" font-size="12" fill="#86868B">距生日/纪念日</text>
  </g>
  <g transform="translate(940, 90)">
    <rect width="280" height="120" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="20" y="35" font-family="-apple-system" font-size="12" fill="#86868B">📉 冷淡期</text>
    <text x="20" y="84" font-family="-apple-system" font-size="36" font-weight="700" fill="#92B8D8">5</text>
    <text x="120" y="84" font-family="-apple-system" font-size="12" fill="#86868B">需主动问候</text>
  </g>

  <!-- 6 模块网格 -->
  <g transform="translate(40, 240)">
    <rect width="280" height="140" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <rect width="280" height="4" rx="2" fill="#8B7FE8"/>
    <circle cx="40" cy="40" r="16" fill="rgba(139,127,232,0.12)"/>
    <text x="34" y="46" font-size="16" fill="#8B7FE8">👤</text>
    <text x="68" y="36" font-family="-apple-system" font-size="16" font-weight="600" fill="#1D1D1F">联系人</text>
    <text x="68" y="56" font-family="-apple-system" font-size="12" fill="#6E6E73">87 人 · 12 个标签</text>
  </g>
  <g transform="translate(340, 240)">
    <rect width="280" height="140" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <rect width="280" height="4" rx="2" fill="#5BB5E0"/>
    <circle cx="40" cy="40" r="16" fill="rgba(91,181,224,0.12)"/>
    <text x="34" y="46" font-size="16" fill="#5BB5E0">🕸️</text>
    <text x="68" y="36" font-family="-apple-system" font-size="16" font-weight="600" fill="#1D1D1F">关系图谱</text>
    <text x="68" y="56" font-family="-apple-system" font-size="12" fill="#6E6E73">节点 87 · 边 142</text>
  </g>
  <g transform="translate(640, 240)">
    <rect width="280" height="140" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <rect width="280" height="4" rx="2" fill="#FF8C5A"/>
    <circle cx="40" cy="40" r="16" fill="rgba(255,140,90,0.12)"/>
    <text x="34" y="46" font-size="16" fill="#FF8C5A">📅</text>
    <text x="68" y="36" font-family="-apple-system" font-size="16" font-weight="600" fill="#1D1D1F">互动时间线</text>
    <text x="68" y="56" font-family="-apple-system" font-size="12" fill="#6E6E73">本月 23 次 · 较上月 +18%</text>
  </g>

  <!-- 待办区域 -->
  <g transform="translate(40, 420)">
    <rect width="580" height="340" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="20" y="35" font-family="-apple-system" font-size="16" font-weight="600" fill="#1D1D1F">⏰ 即将到期</text>

    <g transform="translate(20, 60)">
      <rect width="540" height="44" rx="8" fill="#FBFBFD"/>
      <circle cx="22" cy="22" r="8" fill="none" stroke="#86868B" stroke-width="1.5"/>
      <text x="50" y="20" font-family="-apple-system" font-size="13" fill="#1D1D1F">发方案给张三</text>
      <text x="50" y="36" font-family="-apple-system" font-size="11" fill="#86868B">昨天答应 · 还有 2 天</text>
    </g>
    <g transform="translate(20, 114)">
      <rect width="540" height="44" rx="8" fill="#FBFBFD"/>
      <circle cx="22" cy="22" r="8" fill="none" stroke="#86868B" stroke-width="1.5"/>
      <text x="50" y="20" font-family="-apple-system" font-size="13" fill="#1D1D1F">约王五跑步</text>
      <text x="50" y="36" font-family="-apple-system" font-size="11" fill="#86868B">明天 · 周末</text>
    </g>
    <g transform="translate(20, 168)">
      <rect width="540" height="44" rx="8" fill="#FBFBFD"/>
      <circle cx="22" cy="22" r="8" fill="#FFB088" opacity="0.3"/>
      <circle cx="22" cy="22" r="8" fill="none" stroke="#E8919C" stroke-width="1.5"/>
      <path d="M 18 22 L 21 25 L 26 19" stroke="#E8919C" stroke-width="1.5" fill="none"/>
      <text x="50" y="20" font-family="-apple-system" font-size="13" fill="#1D1D1F">回李四电话</text>
      <text x="50" y="36" font-family="-apple-system" font-size="11" fill="#FFB088">今天到期</text>
    </g>
    <g transform="translate(20, 222)">
      <rect width="540" height="44" rx="8" fill="#FBFBFD"/>
      <circle cx="22" cy="22" r="8" fill="none" stroke="#86868B" stroke-width="1.5"/>
      <text x="50" y="20" font-family="-apple-system" font-size="13" fill="#1D1D1F">买赵六生日礼物</text>
      <text x="50" y="36" font-family="-apple-system" font-size="11" fill="#86868B">还有 5 天</text>
    </g>
  </g>

  <!-- 右侧 AI 洞察 -->
  <g transform="translate(640, 420)">
    <rect width="580" height="340" rx="14" fill="#1D1D1F"/>
    <text x="20" y="35" font-family="-apple-system" font-size="14" font-weight="600" fill="#A89BF0">🤖 AI 建议</text>
    <text x="20" y="65" font-family="-apple-system" font-size="18" font-weight="600" fill="white">张三需要你主动联系</text>
    <text x="20" y="92" font-family="-apple-system" font-size="13" fill="rgba(255,255,255,0.7)">已 45 天未互动，关系强度 4★</text>
    <rect x="20" y="120" width="160" height="40" rx="12" fill="#0071E3"/>
    <text x="100" y="145" font-family="-apple-system" font-size="13" font-weight="600" fill="white" text-anchor="middle">查看话术</text>
    <text x="200" y="145" font-family="-apple-system" font-size="13" fill="#A89BF0">稍后提醒</text>

    <text x="20" y="220" font-family="-apple-system" font-size="14" font-weight="600" fill="#A89BF0">📊 关系趋势</text>
    <polyline points="20,290 80,270 140,280 200,250 260,240 320,220 380,230 440,200 500,210 560,180" stroke="#7FD4A0" stroke-width="2" fill="none"/>
    <text x="20" y="320" font-family="-apple-system" font-size="11" fill="rgba(255,255,255,0.5)">过去 30 天互动次数</text>
  </g>
</svg>

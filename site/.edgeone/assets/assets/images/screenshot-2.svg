<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
  <rect width="1280" height="800" fill="#FBFBFD"/>

  <!-- Header -->
  <rect width="1280" height="56" fill="#FFFFFF"/>
  <rect x="0" y="56" width="1280" height="1" fill="#E5E5EA"/>
  <rect x="32" y="16" width="24" height="24" rx="6" fill="#8B7FE8"/>
  <text x="68" y="33" font-family="-apple-system" font-size="14" font-weight="600" fill="#1D1D1F">RH Intel</text>
  <text x="320" y="33" font-family="-apple-system" font-size="13" font-weight="600" fill="#5BB5E0">关系图谱</text>

  <!-- 左侧筛选栏 -->
  <g transform="translate(40, 90)">
    <rect width="220" height="660" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="20" y="30" font-family="-apple-system" font-size="14" font-weight="600" fill="#1D1D1F">筛选</text>

    <text x="20" y="70" font-family="-apple-system" font-size="11" font-weight="600" fill="#86868B">标签</text>
    <g transform="translate(20, 84)">
      <rect width="80" height="28" rx="14" fill="rgba(139,127,232,0.1)"/>
      <text x="40" y="18" font-family="-apple-system" font-size="12" fill="#8B7FE8" text-anchor="middle">跑团</text>
    </g>
    <g transform="translate(108, 84)">
      <rect width="68" height="28" rx="14" fill="rgba(78,205,196,0.1)"/>
      <text x="34" y="18" font-family="-apple-system" font-size="12" fill="#4ECDC4" text-anchor="middle">同事</text>
    </g>
    <g transform="translate(20, 124)">
      <rect width="76" height="28" rx="14" fill="rgba(255,176,136,0.1)"/>
      <text x="38" y="18" font-family="-apple-system" font-size="12" fill="#FFB088" text-anchor="middle">核心</text>
    </g>

    <text x="20" y="190" font-family="-apple-system" font-size="11" font-weight="600" fill="#86868B">强度</text>
    <g transform="translate(20, 204)">
      <rect width="44" height="28" rx="14" fill="#FFD66B"/>
      <text x="22" y="18" font-family="-apple-system" font-size="12" fill="white" text-anchor="middle">5★</text>
    </g>
    <g transform="translate(72, 204)">
      <rect width="44" height="28" rx="14" fill="#FFA47C"/>
      <text x="22" y="18" font-family="-apple-system" font-size="12" fill="white" text-anchor="middle">4★</text>
    </g>
    <g transform="translate(124, 204)">
      <rect width="44" height="28" rx="14" fill="#95D5A8"/>
      <text x="22" y="18" font-family="-apple-system" font-size="12" fill="white" text-anchor="middle">3★</text>
    </g>
  </g>

  <!-- 图谱主区 -->
  <g transform="translate(280, 90)">
    <rect width="960" height="660" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>

    <!-- 节点 1：中央我 -->
    <g transform="translate(480, 330)">
      <circle r="40" fill="#0071E3"/>
      <text y="6" font-family="-apple-system" font-size="18" font-weight="700" fill="white" text-anchor="middle">我</text>
    </g>

    <!-- 周围节点 -->
    <line x1="480" y1="330" x2="280" y2="180" stroke="#8B7FE8" stroke-width="2" opacity="0.4"/>
    <line x1="480" y1="330" x2="680" y2="160" stroke="#FFD66B" stroke-width="3" opacity="0.6"/>
    <line x1="480" y1="330" x2="240" y2="380" stroke="#5BB5E0" stroke-width="2" opacity="0.4"/>
    <line x1="480" y1="330" x2="720" y2="380" stroke="#FFA47C" stroke-width="3" opacity="0.6"/>
    <line x1="480" y1="330" x2="320" y2="540" stroke="#4ECDC4" stroke-width="2" opacity="0.4"/>
    <line x1="480" y1="330" x2="640" y2="560" stroke="#FFB088" stroke-width="2" opacity="0.4"/>

    <!-- 节点之间的连接 -->
    <line x1="280" y1="180" x2="680" y2="160" stroke="#86868B" stroke-width="1" opacity="0.3" stroke-dasharray="4,2"/>
    <line x1="240" y1="380" x2="720" y2="380" stroke="#86868B" stroke-width="1" opacity="0.3" stroke-dasharray="4,2"/>

    <g transform="translate(280, 180)">
      <circle r="32" fill="#8B7FE8"/>
      <text y="5" font-family="-apple-system" font-size="13" fill="white" text-anchor="middle">张</text>
    </g>
    <text x="280" y="230" font-family="-apple-system" font-size="11" fill="#6E6E73" text-anchor="middle">张三 4★</text>

    <g transform="translate(680, 160)">
      <circle r="34" fill="#FFD66B"/>
      <text y="5" font-family="-apple-system" font-size="13" font-weight="600" fill="white" text-anchor="middle">王</text>
    </g>
    <text x="680" y="210" font-family="-apple-system" font-size="11" fill="#6E6E73" text-anchor="middle">王五 5★ 核心</text>

    <g transform="translate(240, 380)">
      <circle r="28" fill="#5BB5E0"/>
      <text y="4" font-family="-apple-system" font-size="12" fill="white" text-anchor="middle">李</text>
    </g>
    <text x="240" y="424" font-family="-apple-system" font-size="11" fill="#6E6E73" text-anchor="middle">李四 3★</text>

    <g transform="translate(720, 380)">
      <circle r="32" fill="#FFA47C"/>
      <text y="5" font-family="-apple-system" font-size="13" fill="white" text-anchor="middle">赵</text>
    </g>
    <text x="720" y="428" font-family="-apple-system" font-size="11" fill="#6E6E73" text-anchor="middle">赵六 4★</text>

    <g transform="translate(320, 540)">
      <circle r="26" fill="#4ECDC4"/>
      <text y="4" font-family="-apple-system" font-size="12" fill="white" text-anchor="middle">钱</text>
    </g>
    <text x="320" y="582" font-family="-apple-system" font-size="11" fill="#6E6E73" text-anchor="middle">钱七 3★</text>

    <g transform="translate(640, 560)">
      <circle r="26" fill="#FFB088"/>
      <text y="4" font-family="-apple-system" font-size="12" fill="white" text-anchor="middle">孙</text>
    </g>
    <text x="640" y="602" font-family="-apple-system" font-size="11" fill="#6E6E73" text-anchor="middle">孙八 3★</text>

    <!-- 右下角图例 -->
    <g transform="translate(720, 580)">
      <rect width="220" height="60" rx="8" fill="#FBFBFD"/>
      <text x="12" y="22" font-family="-apple-system" font-size="11" font-weight="600" fill="#86868B">图例</text>
      <circle cx="20" cy="40" r="6" fill="#FFD66B"/>
      <text x="32" y="44" font-family="-apple-system" font-size="10" fill="#6E6E73">核心</text>
      <circle cx="80" cy="40" r="6" fill="#5BB5E0"/>
      <text x="92" y="44" font-family="-apple-system" font-size="10" fill="#6E6E73">熟识</text>
      <circle cx="140" cy="40" r="6" fill="#92B8D8"/>
      <text x="152" y="44" font-family="-apple-system" font-size="10" fill="#6E6E73">边缘</text>
    </g>
  </g>

  <!-- 顶部工具栏 -->
  <g transform="translate(280, 90)">
    <rect width="960" height="0" fill="none"/>
  </g>
</svg>

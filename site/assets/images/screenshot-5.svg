  </g>

  <!-- 重要日期 -->
  <g transform="translate(40, 180)">
    <rect width="1200" height="280" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="20" y="30" font-family="-apple-system" font-size="14" font-weight="600" fill="#1D1D1F">📅 未来 30 天 · 5 项</text>


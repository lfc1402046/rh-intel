      <text x="35" y="17" font-family="-apple-system" font-size="11" fill="#5DA975" text-anchor="middle">跑步</text>
    </g>
    <g transform="translate(98, 75)">
      <rect width="86" height="26" rx="13" fill="rgba(126,212,160,0.2)"/>
      <text x="43" y="17" font-family="-apple-system" font-size="11" fill="#5DA975" text-anchor="middle">咖啡</text>
    </g>
    <g transform="translate(192, 75)">

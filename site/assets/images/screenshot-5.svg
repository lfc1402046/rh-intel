<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
  <rect width="1280" height="800" fill="#FBFBFD"/>

  <!-- Header -->
  <rect width="1280" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#E5E5EA"/>
  <rect x="32" y="16" width="24" height="24" rx="6" fill="#8B7FE8"/>
  <text x="68" y="33" font-family="-apple-system" font-size="14" font-weight="600" fill="#1D1D1F">RH Intel</text>
  <text x="340" y="33" font-family="-apple-system" font-size="13" font-weight="600" fill="#FFB088">关键信息</text>

  <!-- 4 大类切换 -->
  <g transform="translate(40, 100)">
    <rect width="160" height="40" rx="20" fill="#FFB088"/>
    <text x="80" y="26" font-family="-apple-system" font-size="13" font-weight="600" fill="white" text-anchor="middle">📅 重要日期</text>
  </g>
  <g transform="translate(220, 100)">
    <rect width="160" height="40" rx="20" fill="white" stroke="#E5E5EA"/>
    <text x="80" y="26" font-family="-apple-system" font-size="13" fill="#6E6E73" text-anchor="middle">✅ 待办</text>
  </g>
  <g transform="translate(400, 100)">
    <rect width="160" height="40" rx="20" fill="white" stroke="#E5E5EA"/>
    <text x="80" y="26" font-family="-apple-system" font-size="13" fill="#6E6E73" text-anchor="middle">🚫 敏感</text>

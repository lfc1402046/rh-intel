      <circle cx="22" cy="21" r="9" fill="#FFB088" opacity="0.3"/>
      <circle cx="22" cy="21" r="9" fill="none" stroke="#E8919C" stroke-width="1.5"/>
      <path d="M 18 21 L 21 24 L 26 18" stroke="#E8919C" stroke-width="1.5" fill="none"/>
      <text x="44" y="20" font-family="-apple-system" font-size="13" font-weight="600" fill="#1D1D1F">回李四电话</text>
      <text x="44" y="36" font-family="-apple-system" font-size="11" fill="#FFB088">今天到期 · 与上次见面聊到的话题</text>
      <text x="700" y="20" font-family="-apple-system" font-size="11" fill="#86868B" text-anchor="end">⏰ 紧急</text>
    </g>

    <g transform="translate(20, 105)">

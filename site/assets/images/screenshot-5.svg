      <text x="20" y="58" font-family="-apple-system" font-size="22" font-weight="700" fill="#1D1D1F">李四 生日</text>
      <text x="20" y="82" font-family="-apple-system" font-size="12" fill="#6E6E73">11月15日 · 周日</text>
    </g>

    <g transform="translate(320, 60)">
      <rect width="280" height="100" rx="12" fill="#FBFBFD"/>
      <text x="20" y="32" font-family="-apple-system" font-size="11" fill="#86868B">7 天后</text>
      <text x="20" y="58" font-family="-apple-system" font-size="20" font-weight="700" fill="#1D1D1F">赵六 入职 3 年</text>
      <text x="20" y="82" font-family="-apple-system" font-size="12" fill="#6E6E73">2023-11-19</text>
    </g>

    <g transform="translate(620, 60)">
      <rect width="280" height="100" rx="12" fill="#FBFBFD"/>
      <text x="20" y="32" font-family="-apple-system" font-size="11" fill="#86868B">14 天后</text>
      <text x="20" y="58" font-family="-apple-system" font-size="20" font-weight="700" fill="#1D1D1F">爸 生日</text>
      <text x="20" y="82" font-family="-apple-system" font-size="12" fill="#6E6E73">家人 · 第 2 圈</text>
    </g>

    <g transform="translate(920, 60)">
      <rect width="280" height="100" rx="12" fill="#FBFBFD"/>
      <text x="20" y="32" font-family="-apple-system" font-size="11" fill="#86868B">28 天后</text>
      <text x="20" y="58" font-family="-apple-system" font-size="20" font-weight="700" fill="#1D1D1F">王五 结婚纪念</text>
      <text x="20" y="82" font-family="-apple-system" font-size="12" fill="#6E6E73">每年循环</text>

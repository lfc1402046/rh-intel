      <text x="50" y="17" font-family="-apple-system" font-size="11" fill="#5DA975" text-anchor="middle">科技书</text>
    </g>

    <text x="20" y="125" font-family="-apple-system" font-size="11" fill="#86868B">避免</text>
    <g transform="translate(20, 135)">
      <rect width="78" height="26" rx="13" fill="rgba(232,137,137,0.2)"/>
      <text x="39" y="17" font-family="-apple-system" font-size="11" fill="#C26868" text-anchor="middle">甜食</text>
    </g>
    <g transform="translate(106, 135)">
      <rect width="100" height="26" rx="13" fill="rgba(232,137,137,0.2)"/>
      <text x="50" y="17" font-family="-apple-system" font-size="11" fill="#C26868" text-anchor="middle">聊家庭</text>
    </g>

    <text x="20" y="190" font-family="-apple-system" font-size="11" fill="#86868B">家庭</text>
    <g transform="translate(20, 200)">
      <rect width="80" height="26" rx="13" fill="rgba(139,127,232,0.2)"/>
      <text x="40" y="17" font-family="-apple-system" font-size="11" fill="#6B5FCC" text-anchor="middle">妻子·林</text>
    </g>
    <g transform="translate(108, 200)">
      <rect width="74" height="26" rx="13" fill="rgba(139,127,232,0.2)"/>
      <text x="37" y="17" font-family="-apple-system" font-size="11" fill="#6B5FCC" text-anchor="middle">女儿·8岁</text>
    </g>

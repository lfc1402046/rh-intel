      <circle cx="22" cy="21" r="9" fill="none" stroke="#86868B" stroke-width="1.5"/>
      <text x="44" y="20" font-family="-apple-system" font-size="13" font-weight="600" fill="#1D1D1F">发方案给张三</text>
      <text x="44" y="36" font-family="-apple-system" font-size="11" fill="#86868B">还有 2 天 · 商务合作</text>
      <text x="700" y="20" font-family="-apple-system" font-size="11" fill="#86868B" text-anchor="end">📅 即将</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="740" height="42" rx="8" fill="#FBFBFD"/>
      <circle cx="22" cy="21" r="9" fill="none" stroke="#86868B" stroke-width="1.5"/>
      <text x="44" y="20" font-family="-apple-system" font-size="13" font-weight="600" fill="#1D1D1F">约王五周末跑步</text>
      <text x="44" y="36" font-family="-apple-system" font-size="11" fill="#86868B">明天 · 周末健身</text>
      <text x="700" y="20" font-family="-apple-system" font-size="11" fill="#86868B" text-anchor="end">📅 即将</text>
    </g>

    <g transform="translate(20, 205)">
      <rect width="740" height="42" rx="8" fill="#FBFBFD"/>
      <circle cx="22" cy="21" r="9" fill="none" stroke="#86868B" stroke-width="1.5"/>
      <text x="44" y="20" font-family="-apple-system" font-size="13" font-weight="600" fill="#1D1D1F">买赵六生日礼物</text>
      <text x="44" y="36" font-family="-apple-system" font-size="11" fill="#86868B">还有 14 天 · 喜好：跑步装备</text>
      <text x="700" y="20" font-family="-apple-system" font-size="11" fill="#86868B" text-anchor="end">📅 计划中</text>
    </g>
  </g>

  <!-- 偏好面板 -->
  <g transform="translate(840, 490)">
    <rect width="400" height="270" rx="14" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="20" y="30" font-family="-apple-system" font-size="14" font-weight="600" fill="#1D1D1F">🎁 王五 · 偏好记录</text>

    <text x="20" y="65" font-family="-apple-system" font-size="11" fill="#86868B">喜欢</text>
    <g transform="translate(20, 75)">

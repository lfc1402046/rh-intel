      <text x="58" y="20" font-family="-apple-system" font-size="13" font-weight="600" fill="#1D1D1F">王五</text>
      <text x="100" y="20" font-family="-apple-system" font-size="11" fill="#86868B">微信 · 跑步话题</text>
      <text x="58" y="35" font-family="-apple-system" font-size="11" fill="#6E6E73">聊到他新项目方向，分享了几个 AI 趋势...</text>

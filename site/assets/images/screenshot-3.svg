      <circle cx="30" cy="20" r="14" fill="#FFA47C"/>
      <text x="30" y="25" font-family="-apple-system" font-size="12" fill="white" text-anchor="middle">赵</text>
      <text x="58" y="20" font-family="-apple-system" font-size="13" font-weight="600" fill="#1D1D1F">赵六</text>
      <text x="100" y="20" font-family="-apple-system" font-size="11" fill="#86868B">微信 · 工作对接</text>
      <text x="58" y="35" font-family="-apple-system" font-size="11" fill="#6E6E73">讨论了项目排期，答应下周二同步给方案...</text>
      <text x="1100" y="20" font-family="-apple-system" font-size="11" fill="#86868B" text-anchor="end">3 天前</text>
      <text x="1100" y="35" font-family="-apple-system" font-size="10" fill="#FFB088" text-anchor="end">⏰ 待跟进</text>

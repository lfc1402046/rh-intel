      <circle cx="30" cy="20" r="14" fill="#FFD66B"/>
      <text x="30" y="25" font-family="-apple-system" font-size="12" fill="white" text-anchor="middle">王</text>
      <text x="58" y="20" font-family="-apple-system" font-size="13" font-weight="600" fill="#1D1D1F">王五</text>
      <text x="100" y="20" font-family="-apple-system" font-size="11" fill="#86868B">面对面 · 跑步</text>
      <text x="58" y="35" font-family="-apple-system" font-size="11" fill="#6E6E73">环岛路 10 公里，聊到家庭和工作平衡...</text>

# GitHub Pages 自动部署工作流
# 来源：https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
# 推荐方式：使用官方 actions/deploy-pages（支持环境、保护规则、自定义域名）

name: Deploy site to GitHub Pages

on:
  # main 分支 push 时触发
  push:
    branches: [ main ]
  # 也支持手动触发（Actions 页面 → Run workflow）
  workflow_dispatch:

# 必要的权限配置（GitHub Pages 新部署方式要求）
permissions:
  contents: read        # 读取仓库内容
  pages: write          # 创建/更新 Pages 部署
  id-token: write       # 用于 OIDC 验证（自定义域名必需）

# 同一时间只允许一个部署进行（避免冲突）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 使用 GitHub Pages 环境（可在 Settings → Environments 配置保护规则）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Pages（创建必要的元数据）
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 3. 上传静态文件为部署构件
      #    重要：path 必须指向落地页所在的目录
      #    本项目结构：site/ 目录下是 7 个 HTML 页面 + assets/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      # 4. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 5. （可选）部署成功后触发 webhook 通知
      #    比如发邮件、推送到 Slack、更新状态页
      # - name: Notify deployment
      #   if: success()
      #   run: |
      #     curl -X POST "https://api.statuspage.io/v1/pages/$STATUS_PAGE_ID/components/$COMPONENT_ID" \
      #       -H "Authorization: OAuth $STATUS_PAGE_TOKEN" \
      #       -d '{"component":{"status":"operational"}}'

# ====================================================================
# 使用说明：
# ====================================================================
# 1. 仓库 Settings → Pages → Source 选择 "GitHub Actions"
# 2. 修改配置文件中所有 "username" 为你的 GitHub 用户名
# 3. 修改 sitemap.xml 和 robots.txt 中所有 "username" 同上
# 4. 修改 site/ 目录下所有 .html 文件中 "github.com/xxx" 为 "github.com/你的用户名"
# 5. 可选：添加自定义域名
#    - 在 repo 根目录创建 CNAME 文件，内容为你的域名（如 blog.example.com）
#    - 在域名 DNS 添加 CNAME 记录指向 username.github.io
#    - Settings → Pages → Custom domain 填入域名，Enforce HTTPS 启用
#
# ====================================================================
# 故障排查：
# ====================================================================
# 问题 1：部署失败 "Unable to find action"
#   解决：升级 actions 版本（v3 → v4 → v5）
#
# 问题 2：404 Page Not Found
#   解决：确认 Settings → Pages → Source = "GitHub Actions"（不是 main 分支）
#
# 问题 3：CSS/JS 加载 404
#   解决：使用相对路径（assets/css/main.css 而非 /assets/css/main.css）
#
# 问题 4：自定义域名报 404
#   解决：等 DNS 传播（最长 24 小时），检查 CNAME 文件和 DNS 配置
#
# ====================================================================
